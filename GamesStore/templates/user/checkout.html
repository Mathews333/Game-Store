{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout | GameStore</title>
    <link rel="stylesheet" href="{% static 'user/checkout.css' %}">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">🎮 GameStore</div>
    <nav>
        <a href="{% url 'userpage' %}">Store</a>
        <a href="{% url 'view_cart' %}">Cart</a>
        <a href="{% url 'user_profile' %}">Profile</a>
    </nav>
</header>

<!-- PAGE -->
<main class="checkout-page">

    <div class="checkout-card">

        <h2 class="checkout-title">Checkout</h2>

        <!-- GAME SUMMARY -->
        <div class="game-summary">
            <img src="{{ game.game_image.url }}" alt="{{ game.name }}">

            <div class="game-info">
                <h3>{{ game.name }}</h3>
                <p class="category">{{ game.get_category_display }}</p>
            </div>
        </div>

        <!-- BUYER DETAILS -->
        <div class="checkout-section">
            <h3 class="section-title">Buyer Details</h3>

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    value="{{ request.user.email }}"
                    readonly
                >
                <small class="hint">
                    Receipt will be sent to this email.
                </small>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    value="{{ request.user.username }}"
                    readonly
                >
            </div>
        </div>

        <!-- PRICE -->
        <div class="price-box">
            <div class="row">
                <span>Game Price</span>
                <span>₹ {{ game.game_price }}</span>
            </div>
            <div class="row total">
                <span>Total</span>
                <span>₹ {{ game.game_price }}</span>
            </div>
        </div>

        <!-- RAZORPAY BUTTON -->
        <button id="rzp-button" class="confirm-btn">
            Pay ₹ {{ game.game_price }}
        </button>

        <p class="demo-text">
            Secure payment powered by Razorpay.
        </p>

    </div>

</main>

<!-- RAZORPAY SCRIPT -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
var options = {
    "key": "{{ razorpay_key_id }}",
    "amount": "{{ game.game_price }}00",
    "currency": "INR",
    "name": "GameStore",
    "description": "{{ game.name }}",
    "order_id": "{{ razorpay_order_id }}",
    "handler": function (response){
        window.location.href = "{% url 'payment_success' game.id %}";
    },
    "theme": {
        "color": "#00bcd4"
    }
};

var rzp = new Razorpay(options);

document.getElementById('rzp-button').onclick = function(e){
    rzp.open();
    e.preventDefault();
}
</script>

</body>
</html>
